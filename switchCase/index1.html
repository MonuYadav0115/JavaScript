<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Character encoding for unicode text -->
    <meta charset="UTF-8">
    
    <!-- Controls mobile screen layout and scaling -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Page title displayed in the browser tab -->
    <title>My Standard HTML Website</title>
    
    <!-- Short explanation of page content for search engines -->
    <meta name="description" content="A brief description of my website for SEO purposes.">
    
    <!-- External stylesheet connection -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Area -->
    <header>
        <h1>Welcome to My Website</h1>
        <nav>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main Content Area -->
    <main>
        <section id="home">
            <h2>Primary Heading</h2>
            <p>This is a paragraph inside your main template section.</p>
        </section>
    </main>

    <!-- Footer Area -->
    <footer>
        <p>&copy; 2026 My Website. All rights reserved.</p>
    </footer>

    <!-- JavaScript script connection placed at the end for faster page loading -->
    <script src="javascript3.js"></script>
</body>
</html>
